<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0c0a07" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gradAmber)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Outer Ring Elements -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2d2417" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- Stylized D and S with Earth / Canopy Topography -->
  <!-- Topographic wave (Geophysics & Soil) -->
  <path d="M16 42 Q 24 35, 32 40 T 48 37" fill="none" stroke="url(#gradEmerald)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M18 47 Q 26 42, 34 46 T 46 44" fill="none" stroke="url(#gradEmerald)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Monogram D & S -->
  <!-- D outline -->
  <path d="M22 17 L22 36 M22 17 Q34 17, 34 26.5 Q34 36, 22 36" fill="none" stroke="url(#gradAmber)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- S interlocking wave -->
  <path d="M42 20 C38 18, 32 20, 32 25 C32 30, 42 29, 42 34 C42 39, 35 40, 30 38" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  
  <!-- Subtle Leaf Accent -->
  <path d="M41 15 C45 15, 48 18, 48 22 C44 22, 41 19, 41 15 Z" fill="url(#gradAmber)" opacity="0.9" />
</svg>